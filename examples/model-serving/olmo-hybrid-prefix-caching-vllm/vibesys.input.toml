version = 1

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "benchmark/benchmark.py"]
timeout_seconds = 300

[[workspace.sources]]
name = "vllm"
repo = "https://github.com/vllm-project/vllm"
commit = "132765e3560659ff63ebd236203672e991b70e08"
dest = "vllm"
